<svg fill="none" viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container { font-family: 'Courier New', Courier, monospace; color: #58a6ff; text-align: center; font-size: 24px; padding-top: 20px; }
        .typewriter { overflow: hidden; border-right: .15em solid orange; white-space: nowrap; margin: 0 auto; letter-spacing: .15em; animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite; }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #f0883e; } }
      </style>
      <div class="container">
        <div class="typewriter">Full Stack Developer | Building the Future...</div>
      </div>
    </div>
  </foreignObject>
</svg>
